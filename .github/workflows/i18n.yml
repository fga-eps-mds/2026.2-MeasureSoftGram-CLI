name: Atualizar template de traduções

on:
  push:
    branches: [develop]
    paths:
      - 'src/cli/**.py'
      - 'babel.cfg'
      - 'Makefile'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

concurrency:
  group: i18n-template
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  template:
    name: Extrair mensagens com o pybabel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar o Babel
        run: python -m pip install babel

      - name: Atualizar o msgram.pot e os catálogos
        run: make i18n-extract

      - name: Descartar mudança só de data no cabeçalho
        run: |
          if git diff --quiet -I 'POT-Creation-Date' -I 'Generated-By' -- src/cli/locale; then
            git checkout -- src/cli/locale
          fi

      - name: Conferir se os catálogos compilam
        run: make i18n-compile

      - name: Abrir ou atualizar o PR do template
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.WEBLATE_GITHUB_TOKEN || github.token }}
          branch: i18n/template
          base: develop
          add-paths: |
            src/cli/locale/*.pot
            src/cli/locale/*/LC_MESSAGES/*.po
          commit-message: 'chore(i18n): atualiza o msgram.pot com as mensagens novas do código'
          title: 'chore(i18n): atualiza o msgram.pot com as mensagens novas do código'
          body: |
            Mensagens extraídas do código por `make i18n-extract` depois do último push no `develop`.

            Depois do merge, o Weblate passa a mostrar os textos novos para tradução.
          delete-branch: true
